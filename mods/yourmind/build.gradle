plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = 'dev.y9kudo.overmind'
base { archivesName = 'yourmind' }
loom { clientOnlyMinecraftJar() }

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
test { useJUnitPlatform() }
jar { from('../../LICENSE') { rename { 'LICENSE_yourmind' } } }
tasks.register('installableJar', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into layout.buildDirectory.dir('install')
    rename { 'yourmind.jar' }
}
build.finalizedBy installableJar
