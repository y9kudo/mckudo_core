name: Feature proposal
description: Suggest a concrete capability or developer-experience improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the agent or application and the missing capability.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior or API
      description: A short JSON program or JavaScript example is welcome.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How could we verify it?
      description: Describe a bounded, reproducible test and its expected result.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Relevant Minecraft versions, dependencies, performance budgets or existing workarounds.
