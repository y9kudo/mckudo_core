name: Bug report
description: Report a reproducible kernel, client or dashboard problem.
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package/build, Node.js, OS, Minecraft version, server and loader.
      placeholder: Arthas dev.3, Node.js 24, Windows, Java 1.21.1 vanilla offline server
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal program
      description: Include the smallest JSON or JavaScript example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include the failed action, reason and relevant sanitized log lines. Never include tokens or auth-cache files.
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: Gameplay conditions
      description: For live trials, describe the starting inventory and any item grants, teleports, commands or other interventions.
